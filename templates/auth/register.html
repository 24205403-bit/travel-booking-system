{% extends 'base.html' %}

{% block title %}Create Account - TravelExplorer{% endblock %}

{% block content %}
<div class="main-container" style="max-width: 520px; margin-top: 3rem; margin-bottom: 4rem;">
    <div class="card" style="padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 60px; height: 60px; background: #e0f2fe; color: var(--secondary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem;">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>Create Your Account</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Join us and start booking your dream vacations</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 9876543210">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="role">Register Role</label>
                <select id="role" name="role" class="form-control">
                    <option value="user">Traveler (Standard User)</option>
                    <option value="admin">Administrator (Manager)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.95rem;">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
