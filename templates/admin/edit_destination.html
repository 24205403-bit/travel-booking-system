{% extends 'base.html' %}

{% block title %}Edit Destination - Admin{% endblock %}

{% block content %}
<div class="main-container" style="max-width: 700px;">
    <div class="card" style="padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
        <h2 style="margin-bottom: 1.5rem;">Edit Destination: {{ destination.title }}</h2>

        <form action="{{ url_for('admin.edit_destination', dest_id=destination['_id']) }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="title">Title / Package Name</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ destination.title }}" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label" for="location">Location / State</label>
                    <input type="text" id="location" name="location" class="form-control" value="{{ destination.location }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="category">Category</label>
                    <input type="text" id="category" name="category" class="form-control" value="{{ destination.category }}" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label" for="price">Price (₹ per person)</label>
                    <input type="number" id="price" name="price" class="form-control" value="{{ destination.price }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="duration">Duration</label>
                    <input type="text" id="duration" name="duration" class="form-control" value="{{ destination.duration }}" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="image_url">Image URL</label>
                <input type="text" id="image_url" name="image_url" class="form-control" value="{{ destination.image_url }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-control" rows="4">{{ destination.description }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="highlights">Tour Highlights (Comma separated)</label>
                <input type="text" id="highlights" name="highlights" class="form-control" value="{{ destination.highlights_str }}">
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <a href="{{ url_for('admin.list_destinations') }}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary" style="flex: 1;">Update Package</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
