{% extends 'base.html' %}

{% block title %}Add Review - TravelExplorer{% endblock %}

{% block content %}
<div class="main-container" style="max-width: 550px;">
    <div class="card" style="padding: 2.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
        <h2 style="margin-bottom: 1.5rem;">Write a Review</h2>
        <form action="{{ url_for('review.add_review', dest_id=dest_id) }}" method="POST">
            <div class="form-group">
                <label class="form-label">Rating</label>
                <select name="rating" class="form-control">
                    <option value="5">⭐⭐⭐⭐⭐ (5/5) Excellent</option>
                    <option value="4">⭐⭐⭐⭐ (4/5) Very Good</option>
                    <option value="3">⭐⭐⭐ (3/5) Average</option>
                    <option value="2">⭐⭐ (2/5) Below Expectations</option>
                    <option value="1">⭐ (1/5) Poor</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Review Comment</label>
                <textarea name="comment" class="form-control" rows="4" placeholder="Share your experience..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Review</button>
        </form>
    </div>
</div>
{% endblock %}
